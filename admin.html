<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두두자격지원센터 - 접수 어드민</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">

    <header class="top-bar">
        <div class="top-bar__inner">
            <span class="top-bar__logo">두두자격지원센터 · 어드민</span>
            <nav class="top-bar__nav">
                <a href="index.html" class="font-toggle">접수 화면 보기</a>
                <a href="faq-admin.html" class="font-toggle">FAQ 관리</a>
                <button type="button" id="logoutBtn" class="font-toggle admin-hidden">로그아웃</button>
            </nav>
        </div>
    </header>

    <!-- 로그인 화면 -->
    <main id="loginView" class="admin-page admin-page--narrow">
        <h1 class="page-title">직원 로그인</h1>
        <p class="page-sub">Supabase에 등록된 직원 계정으로 로그인하세요.</p>

        <form id="loginForm" class="apply-form">
            <div class="field">
                <label for="loginEmail">이메일</label>
                <input type="email" id="loginEmail" required autocomplete="username">
            </div>
            <div class="field">
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">로그인</button>
            <p class="submit-status" id="loginStatus" role="alert"></p>
        </form>
    </main>

    <!-- 대시보드 -->
    <main id="dashboardView" class="admin-page admin-hidden">

        <!-- 요약 카드 -->
        <section class="stat-row" id="statRow"></section>

        <!-- 필터 -->
        <section class="filter-bar">
            <div class="filter-field">
                <label for="filterQualification">자격증</label>
                <select id="filterQualification">
                    <option value="">전체</option>
                    <option value="한식조리기능사">한식조리기능사</option>
                    <option value="공인중개사">공인중개사</option>
                    <option value="요양보호사">요양보호사</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="filterStatus">접수상태</label>
                <select id="filterStatus">
                    <option value="">전체</option>
                    <option value="접수완료">접수완료</option>
                    <option value="결제대기">결제대기</option>
                    <option value="취소">취소</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="filterDateFrom">접수일 (부터)</label>
                <input type="date" id="filterDateFrom">
            </div>
            <div class="filter-field">
                <label for="filterDateTo">접수일 (까지)</label>
                <input type="date" id="filterDateTo">
            </div>
            <div class="filter-field">
                <label for="filterKeyword">이름/연락처 검색</label>
                <input type="text" id="filterKeyword" placeholder="이름 또는 연락처">
            </div>
            <div class="filter-actions">
                <button type="button" id="applyFilterBtn" class="submit-btn submit-btn--sm">필터 적용</button>
                <button type="button" id="resetFilterBtn" class="back-btn">초기화</button>
            </div>
        </section>

        <div class="table-toolbar">
            <span id="resultCount" class="table-toolbar__count"></span>
            <button type="button" id="exportCsvBtn" class="back-btn">⬇ CSV로 내보내기</button>
            <button type="button" id="refreshBtn" class="back-btn">↻ 새로고침</button>
        </div>

        <div class="table-wrap">
            <table id="appTable" class="app-table">
                <thead>
                    <tr>
                        <th>접수번호</th>
                        <th>자격증</th>
                        <th>이름</th>
                        <th>연락처</th>
                        <th>시험일</th>
                        <th>지역/센터</th>
                        <th>결제금액</th>
                        <th>결제수단</th>
                        <th>상태</th>
                        <th>접수일시</th>
                    </tr>
                </thead>
                <tbody id="appTableBody">
                    <tr>
                        <td colspan="10" class="table-empty">불러오는 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Supabase 연결 시 아래 주석을 해제하세요 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="common.js"></script>
    <script src="admin.js"></script>
</body>

</html>
