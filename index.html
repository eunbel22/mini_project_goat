<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
    <title>두두자격지원센터 - 접수 신청</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="top-bar">
        <div class="top-bar__inner">
            <span class="top-bar__logo">두두자격지원센터</span>
            <button type="button" id="fontToggle" class="font-toggle" aria-pressed="false">
                <span class="font-toggle__label">글자 크게</span>
                <span class="font-toggle__icon">가+</span>
            </button>
        </div>
    </header>

    <main class="page">

        <!-- 1단계: 자격증 선택 -->
        <section id="step-select" class="step">
            <h1 class="page-title">어떤 자격증을 신청하시나요?</h1>
            <p class="page-sub">아래에서 하나를 골라 눌러 주세요.</p>

            <div class="cert-grid" id="certGrid">
                <button type="button" class="cert-card" data-cert="한식조리기능사">
                    <span class="cert-card__icon" aria-hidden="true">🍳</span>
                    <span class="cert-card__name">한식조리기능사</span>
                    <span class="cert-card__tag">상시 접수 · 14,500원</span>
                </button>

                <button type="button" class="cert-card" data-cert="요양보호사">
                    <span class="cert-card__icon" aria-hidden="true">🤝</span>
                    <span class="cert-card__name">요양보호사</span>
                    <span class="cert-card__tag">상시 접수 · 32,000원</span>
                </button>

                <button type="button" class="cert-card" data-cert="공인중개사">
                    <span class="cert-card__icon" aria-hidden="true">🏠</span>
                    <span class="cert-card__name">공인중개사</span>
                    <span class="cert-card__tag">연 1회 접수</span>
                </button>
            </div>
        </section>

        <!-- 2단계: 신청서 입력 -->
        <section id="step-form" class="step step--hidden">
            <button type="button" id="backBtn" class="back-btn">
                <span aria-hidden="true">←</span> 자격증 다시 고르기
            </button>

            <h1 class="page-title">신청서를 작성해 주세요</h1>
            <p class="page-sub">
                선택한 자격증: <strong id="selectedCertLabel"></strong>
            </p>

            <div id="certNotice" class="notice" role="status"></div>

            <form id="applyForm" class="apply-form" novalidate>

                <!-- 공통 필드 -->
                <fieldset class="field-group">
                    <legend class="field-group__title">신청자 정보</legend>

                    <div class="field">
                        <label for="name">이름 <span class="required">*</span></label>
                        <input type="text" id="name" name="name" autocomplete="name" required placeholder="예) 김영자">
                        <p class="field-error" id="nameError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="birthDate">생년월일 <span class="required">*</span></label>
                        <input type="date" id="birthDate" name="birthDate" required>
                        <p class="field-error" id="birthDateError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label>성별 <span class="required">*</span></label>
                        <div class="radio-row">
                            <label class="radio-pill">
                                <input type="radio" name="gender" value="남" required> 남
                            </label>
                            <label class="radio-pill">
                                <input type="radio" name="gender" value="여" required> 여
                            </label>
                        </div>
                        <p class="field-error" id="genderError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="phone">연락처 <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel" required
                            placeholder="예) 010-1234-5678">
                        <p class="field-hint">숫자만 입력하셔도 됩니다.</p>
                        <p class="field-error" id="phoneError" role="alert"></p>
                    </div>
                </fieldset>

                <!-- 자격증별 동적 필드가 여기 채워집니다 -->
                <fieldset class="field-group">
                    <legend class="field-group__title">시험 정보</legend>
                    <div id="certFields"></div>
                </fieldset>

                <!-- 결제 공통 필드 -->
                <fieldset class="field-group">
                    <legend class="field-group__title">결제 정보</legend>

                    <div class="field">
                        <label for="discountType">감면 대상이신가요?</label>
                        <select id="discountType" name="discountType">
                            <option value="없음">해당 없음</option>
                            <option value="장애인">장애인 (50% 감면)</option>
                            <option value="기초생활수급자">기초생활수급자 (50% 감면)</option>
                            <option value="국가유공자">국가유공자 (50% 감면)</option>
                            <option value="차상위계층">차상위계층 (50% 감면)</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="paymentMethod">결제 수단 <span class="required">*</span></label>
                        <select id="paymentMethod" name="paymentMethod" required>
                            <option value="신용카드">신용카드</option>
                            <option value="계좌이체">계좌이체</option>
                            <option value="가상계좌">가상계좌</option>
                        </select>
                    </div>

                    <div class="fee-box">
                        <span class="fee-box__label">예상 결제금액</span>
                        <span class="fee-box__amount" id="feePreview">-</span>
                    </div>
                    <p class="field-hint">
                        정확한 금액은 접수 시 저희 시스템이 다시 계산해 안내드립니다.
                    </p>
                </fieldset>

                <button type="submit" class="submit-btn" id="submitBtn">
                    신청서 제출하기
                </button>

                <p class="submit-status" id="submitStatus" role="alert"></p>
            </form>
        </section>

        <!-- 3단계: 완료 -->
        <section id="step-done" class="step step--hidden">
            <div class="done-box">
                <span class="done-box__icon" aria-hidden="true">✅</span>
                <h1 class="page-title">신청이 접수되었습니다</h1>
                <p class="page-sub" id="doneSummary"></p>
                <p class="done-box__note">
                    접수 확인은 저희 센터에서 전화로 다시 안내드립니다.<br>
                    궁금하신 점은 <a href="chatbot.html">문의 챗봇</a>에서도 물어보실 수 있어요.
                </p>
                <button type="button" id="restartBtn" class="submit-btn">
                    다른 신청서 작성하기
                </button>
            </div>
        </section>

    </main>

    <footer class="page-footer">
        두두자격지원센터 · 접수 문의는 챗봇 또는 센터로 연락 주세요
    </footer>

    <!-- Supabase 연결 시 아래 주석을 해제하세요 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
