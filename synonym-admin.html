<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두두자격지원센터 - 동의어 관리</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">

    <header class="top-bar">
        <div class="top-bar__inner">
            <span class="top-bar__logo">두두자격지원센터 · 동의어 관리</span>
            <nav class="top-bar__nav">
                <a href="admin.html" class="font-toggle">접수 어드민</a>
                <a href="faq-admin.html" class="font-toggle">FAQ 관리</a>
                <a href="chatbot.html" class="font-toggle">챗봇 미리보기</a>
                <button type="button" id="logoutBtn" class="font-toggle admin-hidden">로그아웃</button>
            </nav>
        </div>
    </header>

    <!-- 로그인 화면 (다른 어드민과 세션 공유되므로 보통은 안 뜬다) -->
    <main id="loginView" class="admin-page admin-page--narrow">
        <h1 class="page-title">직원 로그인</h1>
        <p class="page-sub">Supabase에 등록된 직원 계정으로 로그인하세요.</p>

        <form id="loginForm" class="apply-form">
            <div class="field">
                <label for="loginEmail">이메일</label>
                <input type="email" id="loginEmail" required autocomplete="username">
            </div>
            <div class="field">
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">로그인</button>
            <p class="submit-status" id="loginStatus" role="alert"></p>
        </form>
    </main>

    <!-- 동의어 관리 화면 -->
    <main id="dashboardView" class="admin-page admin-hidden">
        <p class="chat-page__notice">
            어르신들이 실제로 쓰시는 말(줄임말)을 문서에 쓰인 정식 표현으로 연결해두면,
            챗봇이 그 표현으로 물어도 정확한 FAQ를 찾아줘요. 예) "접수비" → "응시료"
        </p>

        <div class="table-toolbar">
            <span id="resultCount" class="table-toolbar__count"></span>
            <button type="button" id="newSynonymBtn" class="submit-btn submit-btn--sm">+ 동의어 추가</button>
            <button type="button" id="refreshBtn" class="back-btn">↻ 새로고침</button>
        </div>

        <div id="synonymList" class="faq-list">
            <p class="table-empty">불러오는 중...</p>
        </div>
    </main>

    <!-- 추가 폼 -->
    <div id="synFormOverlay" class="faq-form-overlay admin-hidden">
        <div class="faq-form-box">
            <h2 class="page-title" style="font-size: 22px;">동의어 추가</h2>

            <form id="synForm" class="apply-form">
                <div class="field">
                    <label for="synInformal">어르신들이 쓰는 말 <span class="required">*</span></label>
                    <input type="text" id="synInformal" required placeholder="예) 접수비">
                </div>

                <div class="field">
                    <label for="synFormal">문서에 쓰인 정식 표현 <span class="required">*</span></label>
                    <input type="text" id="synFormal" required placeholder="예) 응시료">
                </div>

                <div class="faq-form-actions">
                    <button type="button" id="synCancelBtn" class="back-btn">취소</button>
                    <button type="submit" class="submit-btn submit-btn--sm" id="synSaveBtn">저장</button>
                </div>
                <p class="submit-status" id="synFormStatus" role="alert"></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="common.js"></script>
    <script src="synonym-admin.js"></script>
</body>

</html>
